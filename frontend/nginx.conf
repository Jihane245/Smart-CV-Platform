server {
    listen 80;
    server_name localhost;


    root /usr/share/nginx/html;
    index index.html;


    # ── Buffers pour les gros cookies/headers ────────────────────────────────
    large_client_header_buffers 8 64k;
    client_header_buffer_size   64k;


    # ── Frontend : Routage Angular/React ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }


    # ── Proxy /auth → Keycloak (VM DB/Auth) ──────────────────────────────────
    location /auth/ {
        # Utilisation de l'IP Tailscale de ta VM Keycloak
        proxy_pass          http://100.82.209.17:8080/auth/;
        proxy_http_version  1.1;


        # TRANSMISSION DES HEADERS
        # On utilise $http_host pour conserver le nom de domaine Funnel (xxx.ts.net)
        proxy_set_header    Host               $http_host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
       
        # MODIFICATION CRUCIALE : On force "https"
        # Même si la liaison VM RP -> VM App est en HTTP, on informe Keycloak
        # que l'utilisateur final est en HTTPS via le Funnel.
        proxy_set_header    X-Forwarded-Proto  https;


        # Sécurité des cookies et gros headers
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
       
        # Optionnel : désactive la mise en cache des réponses d'auth
        proxy_read_timeout 90s;
    }


    # ── Keycloak silent SSO iframe ────────────────────────────────────────────
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store, no-cache";
    }


    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
