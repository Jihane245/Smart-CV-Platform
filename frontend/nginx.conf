server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Angular app — HTML5 pushState routing ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /auth → Keycloak container ────────────────────────────────────
    # "keycloak" resolves to the Keycloak container via Docker's internal DNS.
    # The browser calls http://localhost/auth/... and nginx forwards it
    # internally — no CORS, no port exposure needed.
    location /auth/ {
        proxy_pass          http://keycloak:8080/auth/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── Keycloak silent SSO iframe ────────────────────────────────────────────
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store, no-cache";
    }

    # ── Cache hashed static assets ────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
