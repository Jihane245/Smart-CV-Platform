<div class="profil-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-icon active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a3 3 0 110 6 3 3 0 010-6zm6 12H6v-.6c0-2 4-3.1 6-3.1s6 1.1 6 3.1V18z"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    </div>
    <div class="sidebar-icon settings">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.06 7.06 0 00-1.62-.94l-.36-2.54A.484.484 0 0014 2h-4a.484.484 0 00-.48.41l-.36 2.54a7.4 7.4 0 00-1.62.94l-2.39-.96a.48.48 0 00-.59.22L2.74 8.47a.47.47 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.47.47 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.36 1.04.67 1.62.94l.36 2.54c.06.28.31.47.59.47h4c.28 0 .53-.19.59-.47l.36-2.54a7.4 7.4 0 001.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 00-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 110-7.2 3.6 3.6 0 010 7.2z"/></svg>
    </div>
    <div class="sidebar-avatar">{{ initiales }}</div>
  </aside>

  <!-- Contenu principal -->
  <main class="main-content">

    <!-- Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Mon profil</h1>
        <p class="page-subtitle">Ces informations alimentent la génération de vos CV</p>
      </div>
      <button class="btn-enregistrer" (click)="enregistrer()">
        Enregistrer les modifications
      </button>
    </div>

    <div class="content-grid">

      <!-- Colonne gauche -->
      <div class="left-col">

        <!-- Carte avatar -->
        <div class="card avatar-card">
          <div class="avatar-circle">{{ initiales }}</div>
          <div class="avatar-name">{{ prenom }} {{ nom }}</div>
          <div class="avatar-email">{{ email }}</div>
          <button class="btn-photo">Changer la photo</button>

          <div class="completude-label">
            <span>COMPLÉTUDE</span>
          </div>
          <div class="completude-row">
            <span class="completude-text">Profil global</span>
            <span class="completude-pct">{{ completude }}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="completude"></div>
          </div>
        </div>

        <!-- Carte compétences -->
        <div class="card">
          <h2 class="card-title">Compétences</h2>
          <div class="tags-list">
            <span
              class="tag"
              *ngFor="let c of competences; let i = index"
              (click)="supprimerCompetence(i)"
              title="Cliquer pour supprimer"
            >{{ c }}</span>
          </div>

          <div *ngIf="ajoutCompetenceVisible" class="add-input-row">
            <input
              type="text"
              class="input-inline"
              placeholder="Nouvelle compétence"
              [(ngModel)]="nouvelleCompetence"
              (keydown.enter)="ajouterCompetence()"
            />
            <button class="btn-add-confirm" (click)="ajouterCompetence()">✓</button>
          </div>

          <button class="btn-ajouter" (click)="ajoutCompetenceVisible = true">
            + Ajouter une compétence
          </button>
        </div>

      </div>

      <!-- Colonne droite -->
      <div class="right-col">

        <!-- Informations personnelles -->
        <div class="card">
          <h2 class="section-title">Informations personnelles</h2>
          <div class="form-grid">
            <div class="field">
              <label>PRÉNOM</label>
              <input type="text" class="form-input" [(ngModel)]="prenom" />
            </div>
            <div class="field">
              <label>NOM</label>
              <input type="text" class="form-input" [(ngModel)]="nom" />
            </div>
            <div class="field">
              <label>EMAIL</label>
              <input type="email" class="form-input" [(ngModel)]="email" />
            </div>
            <div class="field">
              <label>TÉLÉPHONE</label>
              <input type="tel" class="form-input" [(ngModel)]="telephone" />
            </div>
            <div class="field">
              <label>VILLE</label>
              <input type="text" class="form-input" [(ngModel)]="ville" />
            </div>
            <div class="field">
              <label>LINKEDIN</label>
              <input type="text" class="form-input" [(ngModel)]="linkedin" />
            </div>
            <div class="field full-width">
              <label>RÉSUMÉ PROFESSIONNEL</label>
              <textarea class="form-input textarea" [(ngModel)]="resume" rows="4"></textarea>
            </div>
          </div>
        </div>

        <!-- Expériences -->
        <div class="card">
          <h2 class="section-title">Expériences professionnelles</h2>
          <div class="experience-list">
            <div class="experience-item" *ngFor="let exp of experiences; let i = index">
              <div class="exp-dot" [class.actuel]="exp.actuel"></div>
              <div class="exp-content">
                <input type="text" class="input-transparent bold" [(ngModel)]="exp.poste" placeholder="Poste" />
                <input type="text" class="input-transparent small" [(ngModel)]="exp.entreprise" placeholder="Entreprise" />
                <input type="text" class="input-transparent small muted" [(ngModel)]="exp.periode" placeholder="Période" />
                <input type="text" class="input-transparent small" [(ngModel)]="exp.description" placeholder="Description" />
              </div>
            </div>
          </div>
          <button class="btn-ajouter" (click)="ajouterExperience()">+ Ajouter une expérience</button>
        </div>

        <!-- Formation -->
        <div class="card" *ngFor="let f of formations; let i = index">
          <h2 class="section-title" *ngIf="i === 0">Formation</h2>
          <div class="form-grid">
            <div class="field">
              <label>ÉTABLISSEMENT</label>
              <input type="text" class="form-input" [(ngModel)]="f.etablissement" />
            </div>
            <div class="field">
              <label>DIPLÔME</label>
              <input type="text" class="form-input" [(ngModel)]="f.diplome" />
            </div>
            <div class="field">
              <label>DÉBUT</label>
              <input type="text" class="form-input" [(ngModel)]="f.debut" />
            </div>
            <div class="field">
              <label>FIN</label>
              <input type="text" class="form-input" [(ngModel)]="f.fin" />
            </div>
          </div>
        </div>

        <!-- Sections dynamiques -->
        <div class="card section-card" *ngFor="let s of sections; let i = index">

        <div class="section-header-row">
            <button class="btn-suppr-section" (click)="supprimerSection(i)">✕</button>
            <input
            type="text"
            class="input-section-titre"
            [(ngModel)]="s.titre"
            placeholder="Titre de la section"
            />
        </div>

        <hr class="section-divider" />

        <div class="section-lignes">
            <div class="section-ligne" *ngFor="let l of s.lignes; let j = index">
            <input
                type="text"
                class="input-detail"
                [(ngModel)]="l.detail"
                placeholder="Détail"
            />
            <input
                type="text"
                class="input-description"
                [(ngModel)]="l.description"
                placeholder="Description..."
            />
            <button
                class="btn-suppr-ligne"
                *ngIf="j > 0"
                (click)="supprimerLigne(s, j)"
            >✕</button>
            </div>
        </div>

        <button class="btn-add-ligne" (click)="ajouterLigne(s)">+</button>

        </div>

        <!-- Bouton ajouter une section -->
        <div class="add-section-row">
        <button class="btn-add-section" (click)="ajouterSection()">Ajouter une Section</button>
        </div>

      </div>
    </div>
  </main>
</div>
