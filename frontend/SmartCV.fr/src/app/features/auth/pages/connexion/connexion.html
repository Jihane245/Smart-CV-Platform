<div class="auth-layout">

  <!-- Panneau gauche -->
  <div class="left-panel">
    <div class="logo-placeholder">LOGO HERE</div>
  </div>

  <!-- Panneau droit -->
  <div class="right-panel">

    <!-- Navigation haut -->
    <div class="top-nav">
      <button class="btn-nav" (click)="goToInscription()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
        Inscription
      </button>
    </div>

    <!-- Carte formulaire -->
    <div class="form-card">
      <h1 class="form-title">CONNEXION</h1>

      <form [formGroup]="connexionForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Identifiant -->
        <div class="field-group">
          <input
            type="text"
            class="form-input"
            [class.error]="isInvalid('identifiant')"
            placeholder="Email ou nom d'utilisateur"
            formControlName="identifiant"
            autocomplete="username"
          />
          <span class="error-msg" *ngIf="isInvalid('identifiant')">Ce champ est requis.</span>
        </div>

        <!-- Mot de passe -->
        <div class="field-group">
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-input with-icon"
              [class.error]="isInvalid('motDePasse')"
              placeholder="Mot de passe"
              formControlName="motDePasse"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-eye" (click)="togglePassword()">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
          <span class="error-msg" *ngIf="isInvalid('motDePasse')">Le mot de passe est requis.</span>
        </div>

        <!-- Mot de passe oublié -->
        <div class="forgot-password">
          <a (click)="goToMotDePasseOublie()" style="cursor:pointer">Mot de passe oublié ?</a>
        </div>

        <!-- Bouton Se connecter -->
        <button type="submit" class="btn-submit">
          Se connecter
        </button>

        <!-- Séparateur -->
        <div class="divider">
          <span></span>
        </div>

        <!-- Bouton Google -->
        <button type="button" class="btn-google">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
          Continue with Google
        </button>

      </form>
    </div>
  </div>
</div>
