<div class="auth-layout">

  <!-- Panneau gauche -->
  <div class="left-panel">
    <div class="logo-placeholder">LOGO?</div>
  </div>

  <!-- Panneau droit -->
  <div class="right-panel">

    <!-- Navigation haut -->
    <div class="top-nav">
      <button class="btn-nav" (click)="goToConnexion()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
        Connexion
      </button>
    </div>

    <!-- Carte formulaire -->
    <div class="form-card">
      <h1 class="form-title">INSCRIPTION</h1>

      <form [formGroup]="inscriptionForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Nom -->
        <div class="field-group">
          <input
            type="text"
            class="form-input"
            [class.error]="isInvalid('nom')"
            placeholder="Nom"
            formControlName="nom"
            autocomplete="family-name"
          />
          <span class="error-msg" *ngIf="hasError('nom', 'required')">Le nom est requis.</span>
          <span class="error-msg" *ngIf="hasError('nom', 'minlength')">Minimum 2 caractères.</span>
        </div>

        <!-- Prénom -->
        <div class="field-group">
          <input
            type="text"
            class="form-input"
            [class.error]="isInvalid('prenom')"
            placeholder="Prénom"
            formControlName="prenom"
            autocomplete="given-name"
          />
          <span class="error-msg" *ngIf="hasError('prenom', 'required')">Le prénom est requis.</span>
          <span class="error-msg" *ngIf="hasError('prenom', 'minlength')">Minimum 2 caractères.</span>
        </div>

        <!-- Email -->
        <div class="field-group">
          <input
            type="email"
            class="form-input"
            [class.error]="isInvalid('email')"
            placeholder="Adresse email"
            formControlName="email"
            autocomplete="email"
          />
          <span class="error-msg" *ngIf="hasError('email', 'required')">L'adresse email est requise.</span>
          <span class="error-msg" *ngIf="hasError('email', 'email')">Adresse email invalide.</span>
        </div>

        <!-- Mot de passe -->
        <div class="field-group">
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-input with-icon"
              [class.error]="isInvalid('motDePasse')"
              placeholder="Mot de passe"
              formControlName="motDePasse"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-eye" (click)="togglePassword()">
              <!-- Œil ouvert -->
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <!-- Œil barré -->
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
          <span class="error-msg" *ngIf="hasError('motDePasse', 'required')">Le mot de passe est requis.</span>
          <span class="error-msg" *ngIf="hasError('motDePasse', 'minlength')">Minimum 8 caractères.</span>
        </div>

        <!-- Confirmer mot de passe -->
        <div class="field-group">
          <div class="input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="form-input with-icon"
              [class.error]="isInvalid('confirmMotDePasse') || passwordsMismatch"
              placeholder="Confirmer le mot de passe"
              formControlName="confirmMotDePasse"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-eye" (click)="toggleConfirmPassword()">
              <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
          <span class="error-msg" *ngIf="hasError('confirmMotDePasse', 'required')">La confirmation est requise.</span>
          <span class="error-msg" *ngIf="passwordsMismatch">Les mots de passe ne correspondent pas.</span>
        </div>

        <!-- Bouton soumettre -->
        <button type="submit" class="btn-submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">S'inscrire</span>
          <span *ngIf="isSubmitting" class="spinner"></span>
        </button>

      </form>
    </div>
  </div>
</div>
