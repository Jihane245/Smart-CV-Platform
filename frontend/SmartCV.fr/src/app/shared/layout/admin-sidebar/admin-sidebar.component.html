<div class="layout" [class.collapsed]="isCollapsed">
  <aside class="sidebar">

    <div class="sidebar-header">
      <button class="toggle-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="app-name">Admin</span>
    </div>

    <nav class="sidebar-nav">

      <a class="nav-item" routerLink="/admin" routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}" title="Tableau de bord">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
        </svg>
        <span class="nav-label">Tableau de bord</span>
      </a>

      <a class="nav-item" routerLink="/admin/utilisateurs" routerLinkActive="active"
         title="Utilisateurs">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="9" cy="8" r="4"/>
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
          <circle cx="17" cy="9" r="3" fill="currentColor" stroke="none"/>
          <path d="M17 14c2.8 0 5 1.8 5 4v2h-5"/>
        </svg>
        <span class="nav-label">Utilisateurs</span>
      </a>

      <a class="nav-item" routerLink="/admin/templates/nouveau" routerLinkActive="active"
         title="Créer un template">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 1.5L18.5 9H13V3.5z"/>
        </svg>
        <span class="nav-label">Nouveau template</span>
      </a>

      <a class="nav-item" routerLink="/user" title="Retour à l'application">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span class="nav-label">Retour app</span>
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar">{{ userInitials }}</div>
        <span class="user-name">{{ displayName }}</span>
        <button class="logout-btn" type="button" (click)="logout()"
                title="Se déconnecter" aria-label="Se déconnecter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

  </aside>

  <main class="main-content">
    <router-outlet/>
  </main>
</div>
