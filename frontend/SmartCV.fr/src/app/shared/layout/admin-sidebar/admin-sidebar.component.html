<aside class="admin-sidebar">

  <!-- Logo / app brand -->
  <div class="sidebar-brand" title="SmartCV — Administration">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
    </svg>
  </div>

  <!-- Dashboard (page principale admin) -->
  <a
    class="sidebar-icon"
    routerLink="/admin"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    title="Tableau de bord"
    aria-label="Tableau de bord"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
    </svg>
  </a>

  <!-- Templates (création / édition) -->
  <a
    class="sidebar-icon"
    routerLink="/admin/templates/nouveau"
    routerLinkActive="active"
    title="Créer un template"
    aria-label="Créer un template"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 1.5L18.5 9H13V3.5z"/>
    </svg>
  </a>

  <!-- Avatar utilisateur (réel, basé sur authService) -->
  <div
    class="sidebar-avatar"
    [title]="displayName"
    [attr.aria-label]="'Connecté en tant que ' + displayName"
  >
    {{ userInitials }}
  </div>

  <!-- Bouton de déconnexion -->
  <button
    class="sidebar-logout"
    type="button"
    (click)="logout()"
    title="Se déconnecter"
    aria-label="Se déconnecter"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  </button>

</aside>
