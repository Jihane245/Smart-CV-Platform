<div class="layout" [class.collapsed]="isCollapsed">

  <aside class="sidebar">

    <!-- Header -->
    <div class="sidebar-header">
      <button class="toggle-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <img src="/assets/logo.png" alt="Cevia" class="sidebar-logo-img">
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

      <a class="nav-item" routerLink="/user" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>

      <a class="nav-item" routerLink="/user/profil" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span class="nav-label">Profil</span>
      </a>

      <a class="nav-item" routerLink="/user/generate-cv" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="16" y2="11"/>
          <line x1="8" y1="15" x2="13" y2="15"/>
          <path d="M15 17l2 2 4-4" stroke-linecap="round"/>
        </svg>
        <span class="nav-label">Generate CV</span>
      </a>

      <a class="nav-item" routerLink="/user/historique" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 12a9 9 0 1 0 3-6.7" stroke-linecap="round"/>
          <path d="M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label">Historique-CV</span>
      </a>

      <a class="nav-item" routerLink="/user/roadmap-historique" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 17l4-8 4 4 4-6 4 4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="7" cy="9" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="11" cy="13" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="7" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="19" cy="11" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span class="nav-label">Roadmap</span>
      </a>

      <a class="nav-item" routerLink="/user/lettre-motivation" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h12l4 4v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
          <line x1="7" y1="10" x2="17" y2="10"/>
          <line x1="7" y1="14" x2="17" y2="14"/>
          <line x1="7" y1="18" x2="13" y2="18"/>
        </svg>
        <span class="nav-label">Lettre de motivation</span>
      </a>

      <a class="nav-item" routerLink="/user/applications" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M9 9h6M9 13h4"/>
        </svg>
        <span class="nav-label">Candidatures</span>
      </a>

      <a class="nav-item" *ngIf="isAdmin" routerLink="/admin" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2z"/>
          <path d="M12 14c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/>
          <circle cx="19" cy="8" r="3" fill="currentColor" stroke="none"/>
        </svg>
        <span class="nav-label">Administration</span>
      </a>

    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">

      <div class="user-row">
        <div class="user-avatar" [class.has-photo]="photoUrl">
          <img *ngIf="photoUrl; else initialsTpl" [src]="photoUrl" alt="Photo de profil" />
          <ng-template #initialsTpl>{{ userInitials }}</ng-template>
        </div>
        <span class="user-name">{{ displayName }}</span>
        <button class="logout-btn" type="button" (click)="logout()" title="Se déconnecter" aria-label="Se déconnecter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </div>
  </aside>

  <!-- Child pages render here -->
  <main class="main-content">
    <router-outlet/>
  </main>
<app-notification-container></app-notification-container>
<app-confirm-dialog></app-confirm-dialog>
</div>
