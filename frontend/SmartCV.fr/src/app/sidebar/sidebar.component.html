<div class="sidebar-layout" [class.sidebar-collapsed]="isSidebarCollapsed">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside class="sidebar">

    <!-- Header / toggle -->
    <div class="sidebar-header">
      <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="sidebar-app-name">SmartCV</span>
    </div>

    <!-- Navigation links -->
    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/sidebar" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">sidebar</span>
      </a>

      <a class="nav-item" routerLink="/sidebar/profile" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span class="nav-label">Profil</span>
      </a>

      <a class="nav-item" routerLink="/sidebar/generate-cv" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="16" y2="11"/>
          <line x1="8" y1="15" x2="13" y2="15"/>
          <path d="M15 17l2 2 4-4" stroke-linecap="round"/>
        </svg>
        <span class="nav-label">Generate CV</span>
      </a>

      <a class="nav-item" routerLink="/sidebar/applications" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M9 9h6M9 13h4"/>
          <circle cx="17" cy="15" r="3" fill="currentColor" fill-opacity="0.15"/>
          <path d="M16 15l1 1 2-2"/>
        </svg>
        <span class="nav-label">Applications</span>
      </a>
    </nav>

    <!-- Bottom: Settings + User + Logout -->
    <div class="sidebar-footer">
      <a class="nav-item" routerLink="/sidebar/settings" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span class="nav-label">Settings</span>
      </a>

      <!-- User info row -->
      <div class="user-row">
        <div class="user-avatar">
          <img *ngIf="userProfile?.avatarUrl; else initials" [src]="userProfile!.avatarUrl" [alt]="displayName"/>
          <ng-template #initials>{{ userInitials }}</ng-template>
        </div>
        <div class="user-info">
          <span class="user-name">{{ displayName }}</span>
          <span class="user-role">{{ userProfile?.email }}</span>
        </div>

        <!-- Logout button -->
        <button
          class="logout-btn"
          (click)="logout()"
          [disabled]="isLoggingOut"
          aria-label="Se déconnecter"
          title="Se déconnecter"
        >
          <svg *ngIf="!isLoggingOut" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <svg *ngIf="isLoggingOut" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
            <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="10"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Main content area ─────────────────────────────────────────────────── -->
  <main class="sidebar-main">
    <router-outlet/>
  </main>

</div>
