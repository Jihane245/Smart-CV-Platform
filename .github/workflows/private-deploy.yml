name: CI/CD SmartCV

on:
  push:
    branches: [ "feature/lettreMotivation " ] # apres on peut changer vers main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ex: khadija11-was/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Utilise le token auto de GitHub

      # --- Build & Push BACKEND ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/khadija11-was/backend:latest

      # --- Build & Push IA SERVICE ---
      - name: Build and push IA Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ai-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/khadija11-was/ia-service:latest
      
      # build et push de frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/khadija11-was/frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }} #  IP Tailscale vm app1
          username: ${{ secrets.VM_USER }} #  user Kali
          key: ${{ secrets.SSH_PRIVATE_KEY }} #  clé SSH privée
          script: |
            cd /home/jihane
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f