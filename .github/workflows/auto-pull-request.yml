name: Auto Pull Request

on:
  push:
    branches:
      - 'feature/*'
      - 'feature-micro/*'

jobs:
  create-pr:
    name: Créer la Pull Request automatiquement
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Extraire le nom de la branche
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Déterminer la branche cible
        id: determine_target
        run: |
          BRANCH="${{ steps.extract_branch.outputs.branch }}"

          if [[ "$BRANCH" == feature-micro/* ]]; then
            echo "base=dev" >> $GITHUB_OUTPUT

          elif [[ "$BRANCH" == feature/* ]]; then
            echo "base=main" >> $GITHUB_OUTPUT

          else
            echo "Branche non supportée"
            exit 1
          fi

      - name: Créer la Pull Request automatiquement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
          BASE: ${{ steps.determine_target.outputs.base }}

        run: |

          echo "Branche source : $BRANCH"
          echo "Branche cible : $BASE"

          # Vérifier si une PR existe déjà
          existing_pr=$(gh pr list \
            --head "$BRANCH" \
            --base "$BASE" \
            --json number \
            --jq '.[0].number')

          if [ -z "$existing_pr" ]; then

            gh pr create \
              --title "Merge $BRANCH → $BASE" \
              --body "## Pull Request automatique

          La branche \`$BRANCH\` a reçu un nouveau push.

          ### Informations
          - Branche source : \`$BRANCH\`
          - Branche cible : \`$BASE\`
          - Déclenché par : ${{ github.actor }}
          - Commit : ${{ github.sha }}

          ### Action requise
          Merci de vérifier et valider cette Pull Request avant le merge." \
              --base "$BASE" \
              --head "$BRANCH"

            echo "Pull Request créée avec succès"

          else
            echo "Une Pull Request existe déjà (#$existing_pr)"
          fi