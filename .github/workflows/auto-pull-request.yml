name: Auto Pull Request

on:
  push:
    branches:
      - 'feature/*'
  

jobs:
  create-pr:
    name: Creer la Pull Request automatiquement
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Extraire le nom de la branche
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Creer la Pull Request vers dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "Branche detectee: $BRANCH"

          # Vérifier si un PR ouvert existe déjà pour cette branche vers dev
          existing_pr=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            BODY=$(cat <<EOF
          ## Pull Request automatique

          La branche \`$BRANCH\` a reçu un nouveau push.

          **Action requise** : l'équipe doit décider si cette branche doit être mergée dans \`dev\`.

          - Branche source : \`$BRANCH\`
          - Branche cible : \`dev\`
          - Déclenché par : \`$ACTOR\`
          - Commit : \`$SHA\`
          EOF
          )

            gh pr create \
              --title "Merge $BRANCH -> dev" \
              --body "$BODY" \
              --base dev \
              --head "$BRANCH"

            echo "Pull Request cree avec succes"
          else
            echo "Un Pull Request existe deja (#$existing_pr)"
          fi
