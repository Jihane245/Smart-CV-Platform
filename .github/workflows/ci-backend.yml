name: CI - Backend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-backend:
    name: Tests xUnit + Moq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore smart-cv-platform.sln
      - run: dotnet build smart-cv-platform.sln --no-restore --configuration Release
      - run: dotnet test backend/SmartCV.Tests --no-build --verbosity normal