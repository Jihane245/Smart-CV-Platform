name: CI - Frontend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-frontend:
    name: Tests Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/SmartCV.fr/package-lock.json
      - run: npm ci
        working-directory: ./frontend/SmartCV.fr
      - run: npm test -- --watch=false
        working-directory: ./frontend/SmartCV.fr