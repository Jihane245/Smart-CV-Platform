name: CD - Build & Deploy

on:
  push:
    branches: [dev, main]

env:
  AWS_REGION: eu-west-1
  ACCOUNT_ID: 325574368800
  EC2_HOST: 54.228.178.65
  EC2_USER: ubuntu

jobs:
  test-frontend:
    name: Tests Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/SmartCV.fr/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: ./frontend/SmartCV.fr

      - name: Lancer les tests Vitest
        run: npm test -- --watch=false
        working-directory: ./frontend/SmartCV.fr

  test-backend:
    name: Tests Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurer les dépendances
        run: dotnet restore
        working-directory: ./backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: ./backend

      - name: Lancer les tests
        run: dotnet test --verbosity normal
        working-directory: ./backend/SmartCV.Tests

  build-and-push:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Configurer AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Frontend
        run: |
          docker build --build-arg BUILD_CONFIG=production \
            -t ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cvapp-frontend:latest \
            ./frontend
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cvapp-frontend:latest

      - name: Build & Push Backend
        run: |
          docker build \
            -t ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cvapp-backend:latest \
            ./backend
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cvapp-backend:latest

      - name: Build & Push IA
        run: |
          docker build \
            -t ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cvapp-ia:latest \
            ./ai-service
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/cvapp-ia:latest

  deploy:
    name: Deploy sur EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            # Login ECR
            aws ecr get-login-password --region eu-west-1 | \
              docker login --username AWS --password-stdin \
              325574368800.dkr.ecr.eu-west-1.amazonaws.com

            # Puller uniquement les nouvelles images
            docker-compose pull frontend backend ia

            # Redémarrer seulement frontend, backend, ia
            # Keycloak, postgres, keycloak-db ne sont PAS touchés
            docker-compose --env-file .env up -d \
              --no-deps \
              --force-recreate \
              frontend backend ia

            # Nettoyer les anciennes images
            docker image prune -f